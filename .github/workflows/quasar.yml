name: QUASAR — test

on:
  push:
    paths: ["quasar/**", ".github/workflows/quasar.yml"]
  pull_request:
    paths: ["quasar/**"]
  workflow_dispatch:

concurrency:
  group: quasar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: quasar
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev \
            libxdo-dev libasound2-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxtst-dev libgbm-dev libegl-dev libwayland-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quasar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quasar/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run --release -p quasar-core --example bench
      - run: npm run build:site

# The website (quasar/site) is built and deployed by Cloudflare Pages from
# this repository: project "quasar", root quasar/, command
# `npm ci && npm run build:site`, output site/dist.
