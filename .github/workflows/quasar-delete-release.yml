name: QUASAR — delete a release

# Manual clean-up: removes a QUASAR GitHub release and its tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete, e.g. quasar-v0.1.1"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            quasar-v*) ;;
            *) echo "::error::Only quasar-v* releases can be deleted here"; exit 1 ;;
          esac
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
