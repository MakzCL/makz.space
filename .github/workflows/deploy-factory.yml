name: Deploy Factory app to Cloudflare Pages

on:
  push:
    paths: ["factory/**", ".github/workflows/deploy-factory.yml"]
  workflow_dispatch:

concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: factory/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Required: the app has no demo mode.
          VITE_SUPABASE_URL: ${{ secrets.FACTORY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FACTORY_SUPABASE_ANON_KEY }}
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 pages project create skalarki-factory --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name=skalarki-factory --branch="${GITHUB_REF_NAME}" --commit-dirty=true
      - name: Explain missing secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Build OK. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy to https://skalarki-factory.pages.dev"
