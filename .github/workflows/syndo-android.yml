name: SEND Android beta

on:
  push:
    branches: ["codex/syndo-messaging-tools", "claude/charming-meitner-a8exoe"]
    paths: ["syndo/**", ".github/workflows/syndo-android.yml"]
  workflow_dispatch:

concurrency:
  group: syndo-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: syndo } }
    env:
      SYNDO_APP_URL: ${{ vars.SYNDO_APP_URL || 'https://syndo.makz.space' }}
      SYNDO_R2_BUCKET: ${{ vars.SYNDO_R2_BUCKET || 'syndo-desktop' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: syndo/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - name: Bundle the current interface for offline preview
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -R web/dist/. android/app/src/main/assets/
      - name: Build installable preview APK
        working-directory: syndo/android
        run: gradle --no-daemon assembleDebug -PsyndoAppUrl="$SYNDO_APP_URL"
      - name: Name the download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SEND-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: send-android-beta
          path: syndo/SEND-beta.apk
          if-no-files-found: error
      - name: Publish APK to Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 r2 object put "$SYNDO_R2_BUCKET/android/SEND.apk" --file SEND-beta.apk --content-type application/vnd.android.package-archive --cache-control no-cache --remote
      - name: Explain missing Cloudflare connection
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::APK is available in this run's artifacts. Cloudflare publishing needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
