name: SEND Android beta

on:
  push:
    branches: ["codex/syndo-messaging-tools", "claude/charming-meitner-a8exoe"]
    paths: ["syndo/**", ".github/workflows/syndo-android.yml"]
  workflow_dispatch:

concurrency:
  group: send-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: syndo } }
    env:
      SEND_APP_URL: ${{ vars.SEND_APP_URL || vars.SYNDO_APP_URL || 'https://syndo.makz.space' }}
      SEND_R2_BUCKET: ${{ vars.SEND_R2_BUCKET || vars.SYNDO_R2_BUCKET || 'syndo-desktop' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: syndo/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - name: Bundle the current interface for offline preview
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -R web/dist/. android/app/src/main/assets/
      - name: Load the release signing key (optional)
        env: { KEYSTORE_B64: "${{ secrets.SEND_ANDROID_KEYSTORE_B64 }}" }
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/send.jks"
          echo "SEND_KEYSTORE=$RUNNER_TEMP/send.jks" >> "$GITHUB_ENV"
      - name: Load the release signing key from SEND's private bucket
        # Same key, kept in the private send-signing R2 bucket and read with the Cloudflare token this workflow
        # already has. Used when the GitHub secrets aren't set.
        env: { KEYSTORE_B64: "${{ secrets.SEND_ANDROID_KEYSTORE_B64 }}" }
        if: env.KEYSTORE_B64 == '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 r2 object get send-signing/android/send-release.jks --file "$RUNNER_TEMP/send.jks" --remote
          npx --yes wrangler@4 r2 object get send-signing/android/keystore-password.txt --file "$RUNNER_TEMP/kp" --remote
          npx --yes wrangler@4 r2 object get send-signing/android/key-alias.txt --file "$RUNNER_TEMP/ka" --remote
          PW=$(cat "$RUNNER_TEMP/kp"); echo "::add-mask::$PW"
          { echo "SEND_KEYSTORE=$RUNNER_TEMP/send.jks"; echo "SIGNING_PASSWORD=$PW"; echo "SIGNING_ALIAS=$(cat "$RUNNER_TEMP/ka")"; } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/kp" "$RUNNER_TEMP/ka"
      - name: Build the APK and the Play Store bundle
        working-directory: syndo/android
        env:
          SEND_KEYSTORE_PASSWORD: ${{ secrets.SEND_ANDROID_KEYSTORE_PASSWORD || env.SIGNING_PASSWORD }}
          SEND_KEY_ALIAS: ${{ secrets.SEND_ANDROID_KEY_ALIAS || env.SIGNING_ALIAS }}
          SEND_KEY_PASSWORD: ${{ secrets.SEND_ANDROID_KEY_PASSWORD || env.SIGNING_PASSWORD }}
          # Optional overrides for the Firebase client settings (build.gradle has SEND's project as the default).
          FCM_APP_ID: ${{ vars.SEND_FCM_APP_ID }}
          FCM_API_KEY: ${{ vars.SEND_FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ vars.SEND_FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.SEND_FCM_SENDER_ID }}
        run: gradle --no-daemon assembleRelease bundleRelease -PsendVersionCode=$((1000 + GITHUB_RUN_NUMBER)) -PsendVersionName="0.9.$GITHUB_RUN_NUMBER" -PsendAppUrl="$SEND_APP_URL" -PfcmAppId="$FCM_APP_ID" -PfcmApiKey="$FCM_API_KEY" -PfcmProjectId="$FCM_PROJECT_ID" -PfcmSenderId="$FCM_SENDER_ID"
      - name: Name the downloads
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SEND-beta.apk
          cp android/app/build/outputs/bundle/release/app-release.aab SEND-play.aab
          [ -n "${SEND_KEYSTORE:-}" ] || echo "::notice::No signing key secrets, so the APK and AAB are signed with a debug key. Fine for sideloading; Google Play needs SEND_ANDROID_KEYSTORE_B64 and its passwords."
      - uses: actions/upload-artifact@v4
        with:
          name: send-android-beta
          path: |
            syndo/SEND-beta.apk
            syndo/SEND-play.aab
          if-no-files-found: error
      - name: Publish APK to Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 r2 object put "$SEND_R2_BUCKET/android/SEND.apk" --file SEND-beta.apk --content-type application/vnd.android.package-archive --cache-control no-cache --remote
      - name: Offer the update inside the app
        # Only builds signed with the release key: Android refuses an update signed with a different key, and
        # debug-signed CI builds get a new key every run.
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SEND_KEYSTORE != ''
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER)); NAME="0.9.$GITHUB_RUN_NUMBER"
          npx --yes wrangler@4 r2 object put "$SEND_R2_BUCKET/android/SEND-$CODE.apk" --file SEND-beta.apk --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable" --remote
          SHA=$(sha256sum SEND-beta.apk | cut -d' ' -f1); SIZE=$(stat -c%s SEND-beta.apk)
          NOTES=$(git log -1 --format=%s | head -c 200)
          node -e 'const [c,n,s,z,notes]=process.argv.slice(1);process.stdout.write(JSON.stringify({versionCode:+c,versionName:n,url:`https://pub-77db39df34ad414fb86b513f573fd57e.r2.dev/android/SEND-${c}.apk`,sha256:s,size:+z,notes}))' "$CODE" "$NAME" "$SHA" "$SIZE" "$NOTES" > version.json
          cat version.json
          npx --yes wrangler@4 r2 object put "$SEND_R2_BUCKET/android/version.json" --file version.json --content-type application/json --cache-control no-cache --remote
      - name: Explain why the in-app update wasn't offered
        if: env.SEND_KEYSTORE == ''
        run: echo "::notice::In-app updates need the release key: GitHub secrets SEND_ANDROID_KEYSTORE_B64 and friends, or the private send-signing R2 bucket."
      - name: Explain missing Cloudflare connection
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::APK is available in this run's artifacts. Cloudflare publishing needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
