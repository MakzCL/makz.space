name: Deploy Dairy Herd web app and invite page

# Publishes dairy/ (the web version and /join invite page) to Cloudflare Pages:
# https://dairy-herd.pages.dev  — invite links point at /join?c=CODE.
on:
  push:
    paths: ["dairy/**", "!dairy/android-app/**", "!dairy/tests/**", ".github/workflows/deploy-dairy.yml"]
  workflow_dispatch:

concurrency:
  group: dairy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and translation checks
        working-directory: dairy
        run: |
          node --test tests/logic.test.mjs
          node tests/i18n-check.mjs
      - name: Assemble site
        run: |
          mkdir site
          cp -r dairy/index.html dairy/join.html dairy/manifest.webmanifest dairy/sw.js dairy/css dairy/js dairy/icons dairy/fonts site/
          printf '/sw.js\n  Cache-Control: no-cache\n/js/*\n  Cache-Control: no-cache\n/css/*\n  Cache-Control: no-cache\n/join*\n  Cache-Control: no-cache\n  X-Robots-Tag: noindex\n/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n' > site/_headers
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 pages project create dairy-herd --production-branch=main || true
          # The app lives on this branch, so publish it as the production site.
          npx --yes wrangler@4 pages deploy site --project-name=dairy-herd --branch=main --commit-dirty=true
      - name: Explain missing secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy to https://dairy-herd.pages.dev"
