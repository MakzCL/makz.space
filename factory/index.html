<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Skalarki Factory</title>
    <meta name="description" content="Skalarki Electronics Ltd — factory operations: shifts, jobs, team work, issues and stock." />
    <meta name="theme-color" content="#0b1033" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SK Factory" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-apple-touch.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>html,body{background:#0b1033;margin:0}
      /* Installed phone app: hold Android's launch-screen frame (icon, 65.5% wide, centred)
         from the very first paint until the animated splash takes over. */
      #boot{display:none}
      @media (display-mode: standalone) and (max-width: 699px){#boot{display:block;position:fixed;inset:0;z-index:200;background:#0b1033;pointer-events:none}
        #boot img{position:absolute;left:50%;top:50%;width:65.5vmin;height:65.5vmin;transform:translate(-50%,-50%);border-radius:28%}}</style>
  </head>
  <body>
    <div id="boot"><img alt="" src="/icon-maskable-512.png" /></div>
    <script>if(/^kimera\./.test(location.hostname)||location.pathname.indexOf("/kimera")===0)document.querySelector("#boot img").src="/kimera-maskable-512.png"</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
