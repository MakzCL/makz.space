<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="q-ring" x1="80" y1="330" x2="432" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EE6FF"/>
      <stop offset=".5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF3DB8"/>
    </linearGradient>
    <linearGradient id="q-jet" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="q-core" cx="256" cy="256" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".34" stop-color="#E9F9FF"/>
      <stop offset=".55" stop-color="#7FE9FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-24 256 256)">
    <!-- far side of the disk, behind the core -->
    <path d="M86 256a170 60 0 0 1 340 0" stroke="url(#q-ring)" stroke-width="22" stroke-linecap="butt" opacity=".42"/>
    <!-- relativistic jets -->
    <path d="M256 14 270 256 256 498 242 256Z" fill="url(#q-jet)"/>
    <!-- core -->
    <circle cx="256" cy="256" r="92" fill="url(#q-core)"/>
    <circle cx="256" cy="256" r="34" fill="#FFFFFF"/>
    <!-- near side of the disk, in front of the core -->
    <path d="M86 256a170 60 0 0 0 340 0" stroke="url(#q-ring)" stroke-width="26" stroke-linecap="butt"/>
  </g>
</svg>
