[workspace]
resolver = "2"
members = ["crates/quasar-core", "src-tauri"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"
authors = ["MAKZ"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
