<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mleczna Droga: zaproszenie</title>
  <meta name="description" content="Join a farm on Mleczna Droga.">
  <meta name="theme-color" content="#154a2d">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 0; background: var(--bg); }
    .j { max-width: 520px; margin: 0 auto; padding: calc(16px + var(--sat)) 16px calc(32px + var(--sab)); }
    .j-hero { background: var(--hero); color: #fff; border-radius: var(--r-lg); padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(14,57,34,.25); }
    .j-hero img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
    .j-hero h1 { color: #fff; font-size: 1.6rem; margin: 12px 0 4px; }
    .j-hero p { margin: 0; opacity: .9; }
    .j-step { display: flex; gap: 14px; align-items: flex-start; }
    .j-num { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; }
    .j-step h2 { margin: 4px 0 6px; font-size: 1.1rem; }
    .j-step .btn { margin-top: 8px; }
    .j-code { font-size: 1.9rem; font-weight: 850; letter-spacing: .1em; font-family: ui-monospace, Menlo, monospace; color: var(--brand); text-align: center; margin: 8px 0; }
    .j-bad { text-align: center; }
    .j small, .j .muted { color: var(--ink-2); }
    .j-lang { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="j" id="j"><p class="loading">…</p></main>
  <script type="module">
    import { SYNC_URL, SYNC_KEY } from './js/config.js';

    const T = {
      en: {
        title: 'You are invited', farm: 'Join {f} on Mleczna Droga', role_worker: 'as a worker', role_admin: 'as an admin',
        s1: 'Download the app', s1d: 'Android phone. After downloading, open the file and allow the install if asked. On Samsung, Auto Blocker must be off.',
        dl: 'Download Mleczna Droga {v}', s2: 'Open the app and join', s2d: 'Once the app is installed, tap “Open in the app” below. Or open the app, choose “Join a farm with a code” and enter:',
        open: 'Open in the app', s3: 'Create your account', s3d: 'Choose your name and PIN. That is your login for this farm.',
        web: 'iPhone or computer?', webd: 'Use Mleczna Droga in the browser instead:', webb: 'Open in the browser', copy: 'Copy code', copied: 'Copied',
        bad: 'This invite has expired or was already used.', badd: 'Ask the farm admin for a new link.', until: 'Works until {d}',
      },
      pl: {
        title: 'Zaproszenie', farm: 'Dołącz do {f} w Mlecznej Drodze', role_worker: 'jako pracownik', role_admin: 'jako administrator',
        s1: 'Pobierz aplikację', s1d: 'Telefon z Androidem. Po pobraniu otwórz plik i zezwól na instalację, jeśli telefon zapyta. W Samsungu wyłącz Auto Blocker.',
        dl: 'Pobierz Mleczną Drogę {v}', s2: 'Otwórz aplikację i dołącz', s2d: 'Po instalacji stuknij „Otwórz w aplikacji” poniżej. Albo otwórz aplikację, wybierz „Dołącz do gospodarstwa z kodem” i wpisz:',
        open: 'Otwórz w aplikacji', s3: 'Załóż konto', s3d: 'Wybierz imię i PIN. To będzie Twoje logowanie w tym gospodarstwie.',
        web: 'iPhone lub komputer?', webd: 'Użyj Mlecznej Drogi w przeglądarce:', webb: 'Otwórz w przeglądarce', copy: 'Kopiuj kod', copied: 'Skopiowano',
        bad: 'To zaproszenie wygasło lub zostało już użyte.', badd: 'Poproś administratora o nowy link.', until: 'Ważne do {d}',
      },
    };
    let lang = /^pl\b/i.test(navigator.language || '') ? 'pl' : 'en';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const tr = (k, v = {}) => T[lang][k].replace(/\{(\w+)\}/g, (_, x) => esc(v[x] ?? ''));
    const code = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    const pretty = code.replace(/(.{4})(.{4})(.{2})/, '$1-$2-$3');
    const root = document.getElementById('j');

    async function rpc(fn, args) {
      const r = await fetch(`${SYNC_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SYNC_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
      return r.json();
    }

    let info = null; let latest = null;
    async function load() {
      [info, latest] = await Promise.all([
        code ? rpc('dairy_invite_info', { p_code: code }).catch(() => ({ valid: false })) : { valid: false },
        fetch(`${SYNC_URL}/storage/v1/object/public/dairy-app/releases/latest.json?t=${Date.now()}`).then((r) => r.json()).catch(() => null),
      ]);
      draw();
    }

    function draw() {
      document.documentElement.lang = lang;
      const langs = `<div class="j-lang"><button class="chip ${lang === 'pl' ? 'on' : ''}" data-l="pl">Polski</button><button class="chip ${lang === 'en' ? 'on' : ''}" data-l="en">English</button></div>`;
      if (!info?.valid) {
        root.innerHTML = `<div class="j-hero"><img src="icons/icon-192.png" alt=""><h1>Mleczna Droga</h1></div>
          <section class="card j-bad"><h2 class="h2">${tr('bad')}</h2><p class="muted">${tr('badd')}</p></section>${langs}`;
      } else {
        const until = new Date(info.expires_at).toLocaleString(lang === 'pl' ? 'pl-PL' : 'en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        root.innerHTML = `
          <div class="j-hero"><img src="icons/icon-192.png" alt=""><p>${tr('title')}</p>
            <h1>${tr('farm', { f: info.farm_name || 'Mleczna Droga' })}</h1><p>${tr(info.role === 'admin' ? 'role_admin' : 'role_worker')} · ${tr('until', { d: until })}</p></div>
          <section class="card j-step"><span class="j-num">1</span><div><h2>${tr('s1')}</h2><p class="muted small">${tr('s1d')}</p>
            ${latest ? `<a class="btn primary big" href="${esc(latest.url)}" data-testid="download">${tr('dl', { v: latest.versionName })}</a>` : ''}</div></section>
          <section class="card j-step"><span class="j-num">2</span><div><h2>${tr('s2')}</h2>
            <p class="muted small">${tr('s2d')}</p>
            <p class="j-code" data-testid="code">${pretty}</p><button class="btn small" data-copy>${tr('copy')}</button>
            <a class="btn primary big" style="width:100%;margin-top:12px" href="dairyherd://join/${code}" data-testid="open-app">${tr('open')}</a></div></section>
          <section class="card j-step"><span class="j-num">3</span><div><h2>${tr('s3')}</h2><p class="muted small">${tr('s3d')}</p></div></section>
          <section class="card"><h2 class="h3">${tr('web')}</h2><p class="muted small">${tr('webd')}</p>
            <a class="btn" href="./?join=${code}">${tr('webb')}</a></section>${langs}`;
        root.querySelector('[data-copy]').onclick = async (e) => {
          try { await navigator.clipboard.writeText(pretty); e.target.textContent = tr('copied'); } catch { /* ignore */ }
        };
      }
      for (const b of root.querySelectorAll('[data-l]')) b.onclick = () => { lang = b.dataset.l; draw(); };
    }
    load();
  </script>
</body>
</html>
