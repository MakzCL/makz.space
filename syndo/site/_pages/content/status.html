<h1>Status</h1>
<p class="lead">Live status of the SEND service.</p>
<div class="status-grid">
<div class="status-item" data-check="https://syndo.makz.space/api/health"><b>SEND service</b><span class="status-pill">Checking…</span></div>
<div class="status-item" data-check="https://syndo.makz.space/"><b>Web app</b><span class="status-pill">Checking…</span></div>
<div class="status-item" data-check="https://syndo.makz.space/api/downloads/windows"><b>Downloads</b><span class="status-pill">Checking…</span></div>
</div>
<p class="small">Checked from your browser just now. Something wrong that isn't shown here? Email <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>.</p>
<script>
for (const el of document.querySelectorAll(".status-item")) {
  const pill = el.querySelector(".status-pill"), url = el.dataset.check, t = performance.now();
  fetch(url, { mode: "no-cors", cache: "no-store" }).then((r) => {
    const ok = r.type === "opaque" || r.ok;
    pill.textContent = ok ? `Operational · ${Math.round(performance.now() - t)} ms` : "Having problems"; pill.className = "status-pill " + (ok ? "ok" : "bad");
  }).catch(() => { pill.textContent = "Unreachable"; pill.className = "status-pill bad"; });
}
</script>
