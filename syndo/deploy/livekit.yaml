# LiveKit SFU configuration for Syndo. Docs: https://docs.livekit.io/home/self-hosting/deployment/
port: 7880
rtc:
  tcp_port: 7881            # ICE/TCP fallback when UDP is blocked
  port_range_start: 50000   # UDP media range — open in the firewall
  port_range_end: 60000
  use_external_ip: true
  # congestion control / simulcast are on by default; nothing here clamps bitrate.
turn:
  enabled: true             # embedded TURN: relays media for clients behind strict NAT/firewalls
  domain: turn.example.com  # set to your TURN hostname (needs its own DNS record → this host)
  tls_port: 5349            # TURN over TLS (works through most corporate proxies)
  udp_port: 3478
  cert_file: /certs/turn.crt   # point at a certificate valid for the TURN domain
  key_file: /certs/turn.key
room:
  empty_timeout: 300
  max_participants: 0       # 0 = unlimited by LiveKit; Syndo enforces per-channel user limits
logging:
  level: info
