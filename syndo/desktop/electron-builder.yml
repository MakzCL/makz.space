# SEND desktop packaging. Build on Windows (GitHub Actions windows-latest): npm run dist:win
appId: space.makz.syndo
productName: SEND
copyright: SEND
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/uiohook-napi/**
win:
  target: [nsis]
  icon: build/icon.png
  artifactName: SEND-Setup-${version}.${ext}
  # Unsigned unless CSC_LINK / CSC_KEY_PASSWORD are provided (Windows SmartScreen will warn until then).
nsis:
  # One click, like Discord: no wizard pages, a short progress bar, then SEND opens with its own
  # startup animation. Updates install silently behind the SEND updater window (see main.ts).
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SEND
  deleteAppDataOnUninstall: false
protocols:
  - name: SEND invite
    schemes: [syndo]
# Auto-update feed: added at build time when SYNDO_UPDATE_URL is set (see .github/workflows/syndo.yml):
#   --config.publish.provider=generic --config.publish.url=$SYNDO_UPDATE_URL
# The feed is a public Cloudflare R2 bucket (or any static host) holding latest.yml + the installer.
